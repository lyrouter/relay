[project]
name = "relay"
version = "0.1.0"
description = "Relay — AI-team workbench. S1 slice."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # Multipart parsing for LOG-5's attachment upload. FastAPI raises at import
    # time without it, so it is a hard dependency rather than an extra.
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    # Argon2id: the current default for password storage, and it carries its
    # own parameters in the hash string, so a future cost bump rehashes on
    # login instead of needing a migration.
    "argon2-cffi>=23.1",
    "pyotp>=2.9",
    # LOG-5's production carrier is self-hosted MinIO (F-4), reached with a
    # standard S3 client (S-25). A hard dependency rather than an extra: the
    # carrier is selected by configuration, so an extra somebody forgot to
    # install turns into ImportError on the first upload of a deployment that
    # otherwise looks healthy.
    "boto3>=1.35",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    # Starlette's TestClient transport. The HTTP layer's tests drive the real
    # ASGI app rather than calling route functions, so the session dependency,
    # the CSRF check and the problem+json handlers are all in the path.
    # Starlette 1.6 moved the transport to httpx2; without it the TestClient
    # raises at *import* time, which collects as an error rather than as a
    # failure and stops the whole suite.
    "httpx2>=2.12",
    "pytest-cov>=6.0",
    "import-linter>=2.1",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: requires a live PostgreSQL cluster",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Autogenerated by alembic; reformatting them makes migration diffs unreadable.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
